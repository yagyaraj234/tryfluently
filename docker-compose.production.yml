name: impromptu-production

services:
  migrate:
    image: impromptu-runtime
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
    command: ["bun", "/app/scripts/migrate.ts"]

  api:
    image: impromptu-runtime
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    command: ["bun", "/app/apps/api/src/index.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "if (!(await fetch('http://localhost:3000/api/auth/providers')).ok) process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: impromptu-runtime
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_URL: http://api:3000
      PORT: "3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "if (!(await fetch('http://localhost:3001/sign-in')).ok) process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN to your public HTTPS origin in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  caddy_data:
  caddy_config:
