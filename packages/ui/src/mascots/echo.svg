<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img"><title>Get Fluency mascot: Echo</title><style>@media (prefers-reduced-motion:reduce){svg *{animation:none!important}}
.k{transform-box:view-box}svg *{animation-iteration-count:infinite;animation-timing-function:ease-in-out}
@keyframes blink{0%,42%,50%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}

